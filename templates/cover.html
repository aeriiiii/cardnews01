<!doctype html>
<!--
  표지 틀 (마무리 카드도 이 틀을 쓴다)
  - 표지:   <main class="card cover">
    마무리: <main class="card cover outro">  (제목이 조금 작아짐)
  - 아이콘이 위, 제목이 아래. 둘을 묶어 카드 한가운데에 놓는다.
  - .title 안의 줄은 <span> 하나씩:
      <span>가는 줄</span>
      <span><span class="strong">굵은 줄 (강조색 띠)</span></span>
    줄이 길면 글자를 줄이지 않고 자동 줄바꿈. 떨어지면 어색한 말은 <span class="keep">…</span>
  - .sub  : 부제 (없으면 지워도 됨)
  - .icon : 선만 있는 SVG, viewBox="0 0 100 100" — 색·굵기·크기는 _shared.css 변수
  output 에 복사할 때는 CSS 경로를 ../../templates/_shared.css 로 바꾼다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080">
  <title>cover</title>
  <link rel="stylesheet" href="_shared.css">
</head>
<body>
  <main class="card cover">
    <div class="icon">
      <!-- 침묵 → 가로줄이 그어진 말풍선 -->
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 18 H84 a8 8 0 0 1 8 8 V62 a8 8 0 0 1 -8 8 H46 L28 86 V70 H16 a8 8 0 0 1 -8 -8 V26 a8 8 0 0 1 8 -8 Z"/>
        <path d="M32 44 H68"/>
      </svg>
    </div>

    <h1 class="title">
      <span>반드시 <span class="keep">침묵해야 할</span></span>
      <span><span class="strong">7가지 순간</span></span>
    </h1>

    <div class="handle">@bibi_blog_world</div>
  </main>
</body>
</html>
